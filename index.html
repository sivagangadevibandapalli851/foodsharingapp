<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Anna Daatha - Unlimited</title><style>body{font-family:Arial;background:#fff8e7;margin:0}header{background:#ff6f00;color:white;padding:16px;text-align:center;font-size:22px;font-weight:bold}.container{padding:15px;max-width:600px;margin:auto}.card{background:white;border-radius:12px;padding:15px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}input,textarea{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}button{border:none;padding:12px;width:100%;border-radius:8px;font-weight:bold;cursor:pointer}.shareBtn{background:#ff6f00;color:white}.claimBtn{background:#2e7d32;color:white;margin-top:8px}.food-item{border-left:5px solid #ff6f00}</style></head><body><header>🍱 Anna Daatha<br><small style=\"font-size:14px\">Unlimited Dishes - Any Location</small></header><div class=\"container\"><div class=\"card\"><h3>Add Your Dish (Unlimited)</h3><input id=\"foodName\" placeholder=\"Dish Name\"><input id=\"location\" placeholder=\"Location - Any City\"><input id=\"quantity\" placeholder=\"Quantity\"><textarea id=\"contact\" placeholder=\"Contact\"></textarea><button class=\"shareBtn\" id=\"shareBtn\">Share Food Now</button><p id=\"msg\" style=\"text-align:center;font-weight:bold\"></p></div><h3>Foods - <span id=\"count\">0</span> Dishes</h3><div id=\"foodList\"></div></div><script>let foods=[];try{foods=JSON.parse(localStorage.getItem('foods')||'[]')}catch(e){}function render(){document.getElementById('count').innerText=foods.length;let l=document.getElementById('foodList');if(!foods.length){l.innerHTML='<p>No food yet</p>';return}l.innerHTML=foods.map((f,i)=>`<div class=\"card food-item\"><b>🍛 ${f.name}</b><br><small>📍 ${f.loc} | ${f.time}</small><br><p>${f.qty}</p><small>📞 ${f.contact}</small><br><button class=\"claimBtn\" onclick=\"alert('${f.contact}')\">Claim</button></div>`).join('')}document.getElementById('shareBtn').onclick=()=>{let n=document.getElementById('foodName').value.trim(),loc=document.getElementById('location').value.trim(),q=document.getElementById('quantity').value.trim(),c=document.getElementById('contact').value.trim(),m=document.getElementById('msg');if(!n||!loc){m.style.color='red';m.innerText='Name & Location kavali';return}foods.unshift({name:n,loc:loc,qty:q,contact:c,time:new Date().toLocaleString()});localStorage.setItem('foods',JSON.stringify(foods));m.style.color='green';m.innerText='Added! Total:'+foods.length;render()};render();</script></body></html>
